<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Island</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="island.css">
</head>
<body>

<!-- The island: a one-line pill that grows into a panel while the pointer is over it -->
<div class="island" id="island">
  <div class="pill" id="pill">
    <span class="pill-dot" id="pill-dot"></span>
    <span class="pill-text" id="pill-text"></span>
    <span class="pill-side" id="pill-side"></span>
    <span class="eq" id="pill-eq" hidden><i></i><i></i><i></i><i></i></span>
  </div>

  <div class="panel">
    <section class="row" id="row-update" hidden>
      <div class="row-main">
        <div class="row-label" id="update-label">Update</div>
        <div class="row-title" id="update-title"></div>
      </div>
      <div class="row-actions">
        <button class="btn accent" id="update-button" data-action="update-download">Download</button>
      </div>
    </section>

    <section class="row" id="row-nudge" hidden>
      <div class="row-main">
        <div class="row-label" id="nudge-label"></div>
        <div class="row-title">Stretch, look away, get some water</div>
      </div>
      <div class="row-actions"><button class="btn" data-action="dismiss-nudge">Got it</button></div>
    </section>

    <!-- Unread messages, newest first. Click one to reply on its channel. -->
    <section class="row stack" id="row-message" hidden>
      <div class="row-head">
        <div class="row-label" id="message-label"></div>
        <span><button class="link-btn" data-action="open" data-page="messages">Open chats</button> · <button class="link-btn" data-action="message-read">Clear all</button></span>
      </div>
      <div class="msg-stack" id="message-list"></div>
    </section>

    <section class="row stack" id="row-presence" hidden>
      <div class="row-label">Right now</div>
      <div class="lines" id="presence-lines"></div>
    </section>

    <section class="row" id="row-timer">
      <div class="row-main">
        <div class="row-label" id="timer-label">Focus timer</div>
        <div class="row-big" id="timer-time">25:00</div>
      </div>
      <div class="row-actions">
        <button class="btn accent" id="timer-toggle" data-action="pomo-toggle">Start</button>
        <button class="btn" data-action="pomo-reset">Reset</button>
      </div>
    </section>

    <section class="row" id="row-class">
      <div class="row-main">
        <div class="row-label" id="class-label"></div>
        <div class="row-title" id="class-title"></div>
        <div class="row-sub" id="class-sub"></div>
      </div>
      <div class="row-actions"><button class="btn" data-action="open" data-page="study">Timetable</button></div>
    </section>

    <section class="row" id="row-media">
      <img class="media-cover" id="media-cover" alt="" hidden />
      <div class="row-main">
        <div class="row-label" id="media-label">Playing</div>
        <div class="row-title" id="media-title"></div>
        <div class="row-sub" id="media-artist"></div>
      </div>
      <div class="row-actions">
        <button class="icon" data-media="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M7 5v14"/><path d="M19 5l-9 7 9 7z"/></svg></button>
        <button class="icon big" data-media="toggle" id="media-toggle" aria-label="Play or pause"></button>
        <button class="icon" data-media="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M17 5v14"/><path d="M5 5l9 7-9 7z"/></svg></button>
      </div>
    </section>

    <section class="row" id="row-mail">
      <div class="row-main">
        <div class="row-label" id="mail-label"></div>
        <div class="row-title" id="mail-title"></div>
        <div class="row-sub" id="mail-from"></div>
      </div>
      <div class="row-actions"><button class="btn" data-action="open" data-page="inbox">Inbox</button></div>
    </section>

    <section class="row stack" id="row-workspaces" hidden>
      <div class="row-label">Workspaces</div>
      <div class="chips" id="workspace-buttons"></div>
    </section>

    <section class="row stack" id="row-countdowns" hidden>
      <div class="row-label">Countdowns</div>
      <div class="lines" id="countdown-lines"></div>
    </section>

    <section class="row quote" id="row-quote">
      <div class="row-main"><div class="quote-text" id="quote-text"></div><div class="row-sub" id="quote-author"></div></div>
      <div class="row-actions"><button class="btn" data-action="open" data-page="today">Open</button></div>
    </section>

    <!-- Out of the way for a while; it comes back by itself, or from the tray menu -->
    <section class="row island-foot">
      <span class="dim small">In the way?</span>
      <span><button class="link-btn" data-action="snooze" data-minutes="30">Hide 30 min</button> · <button class="link-btn" data-action="snooze" data-minutes="120">Hide 2 hours</button></span>
    </section>

    <!-- Type a quick note, a task, or a message to a channel -->
    <section class="row stack" id="row-compose" hidden>
      <div class="chips" id="compose-modes"></div>
      <div class="thread" id="compose-thread"></div>
      <div class="chips" id="compose-nudges"></div>
      <div class="compose-line">
        <input id="compose-input" type="text" maxlength="500" autocomplete="off" spellcheck="false" />
        <button class="btn accent" id="compose-send">Add</button>
      </div>
    </section>
  </div>
</div>

<script src="../visualizer/audio.js"></script>
<script src="island.js"></script>
</body>
</html>
