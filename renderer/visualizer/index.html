<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visualiser</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>
  /* A transparent sheet over the desktop. It never takes clicks (see island.js),
     and it's only on screen while the desktop itself is in front. */
  html, body{margin:0; height:100%; background:transparent; overflow:hidden; user-select:none;}
  canvas{position:fixed; inset:0; width:100%; height:100%;}
  .now{position:fixed; left:48px; bottom:calc(var(--floor, 120px) + 28px); color:#fff; text-shadow:0 2px 18px rgba(0,0,0,.55); opacity:0; transition:opacity .6s;}
  .now.on{opacity:1;}
  .now .title{font-family:'Instrument Serif', Georgia, serif; font-style:italic; font-size:44px; line-height:1.05; max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .now .artist{font-family:'Geist', 'Segoe UI', sans-serif; font-size:15px; letter-spacing:.14em; text-transform:uppercase; opacity:.75; margin-top:6px;}
  body[data-style="ring"] .now{left:50%; bottom:auto; top:50%; transform:translate(-50%, -50%); text-align:center;}
  body[data-style="ring"] .now .title{font-size:30px; max-width:300px;}
  body[data-style="ring"] .now .artist{font-size:12px;}
  /* Album art: the title sits under the cover */
  body[data-style="album"] .now{left:auto; right:var(--album-right, 420px); bottom:var(--album-mid, 260px); transform:translateY(50%); text-align:right;}
  body[data-style="album"] .now .title{font-size:30px; max-width:34vw;}
  body[data-style="album"] .now .artist{font-size:13px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="now" id="now"><div class="title" id="title"></div><div class="artist" id="artist"></div></div>
<script src="audio.js"></script>
<script src="dynamics.js"></script>
<script src="visualizer.js"></script>
<script src="scenes.js"></script>
</body>
</html>
